# Fixture configuration for LayerDependencyRuleTest.
#
# It maps tests/Architecture/Fixtures/LayerRule to the Domain layer so that the
# deliberate framework reference in PretendDomainClass is reported. TC-041 requires
# a rule narrow enough to produce no false positive; this proves the converse — that
# it produces the true positive it exists for.

deptrac:
  paths:
    - .

  layers:
    - name: Domain
      collectors:
        - type: directory
          value: .*

    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^(Illuminate|Laravel|Symfony)\\.*#'

  ruleset:
    Domain: ~
