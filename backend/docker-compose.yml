# Local development database only.
#
# There is no production infrastructure and none is created here: hosting is
# unselected (BAD-DEP-009) and all 21 sizing decisions are open (DADR-15). This
# file exists so that TC-030 ‡ can be honoured — an integration test runs against
# a real MySQL, never an in-memory substitute — and so that OPS-024 ‡ can be
# verified locally: the deployed server must enforce CHECK constraints.
#
# No value is defaulted here. SADR-14 and OPS-098 forbid a secret appearing in an
# artefact, a repository or a build log, so every credential is required from the
# environment and compose fails loudly if one is missing. Names are inventoried in
# .env.example; values live in .env, which is not committed.

services:
  mysql:
    # DADR-02 InnoDB, transactional and crash-safe. OPS-024 ‡ requires a server
    # that enforces CHECK, which MySQL does from 8.0.16. 8.4 is the current LTS.
    image: mysql:8.4
    container_name: cmp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command:
      # DB-010: a Unicode character set covering the full range, with a
      # deterministic collation.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      # DB-009 ‡: every table uses InnoDB.
      - --default-storage-engine=InnoDB
      # DB-034: one time zone reference; the instant is recorded, not a local
      # wall-clock reading.
      - --default-time-zone=+00:00
      # DB-120 ‡ requires a trigger rejecting UPDATE and DELETE on the evidential
      # domain, as a second layer behind the withheld privilege (SEC-110 ‡).
      # Under binary logging MySQL refuses CREATE TRIGGER unless the creator holds
      # SUPER or this is on. The alternative is granting SUPER to the migration
      # account, which would let it stop threads, change any global variable and
      # bypass read_only — an enormous widening for one trigger.
      #
      # MySQL calls this "less safe": the risk is a non-deterministic routine
      # breaking statement-based replication. The binlog format here is ROW, and
      # the trigger is a SIGNAL that writes nothing.
      #
      # This is a DEPLOYMENT REQUIREMENT of DB-120 ‡ that neither DADR-09 nor
      # CMP-DOC-19 anticipates, and it is reported as such.
      - --log-bin-trust-function-creators=ON
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
